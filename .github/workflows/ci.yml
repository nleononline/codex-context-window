name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo test --locked --all-targets
      - run: cargo build --release --locked
      - name: Smoke test POSIX launcher
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLUGIN_ROOT: ${{ github.workspace }}
        run: |
          output="$(
            printf '%s\n' \
              '{"hook_event_name":"SessionStart","source":"startup"}' |
              /bin/sh "$PLUGIN_ROOT/hooks/run-context-window.sh"
          )"
          expected='{"hookSpecificOutput":{"hookEventName":"SessionStart","additionalContext":"<meta>YOUR SESSION JUST STARTED</meta>"}}'
          test "$output" = "$expected"
      - name: Smoke test Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLUGIN_ROOT: ${{ github.workspace }}
        run: |
          $output = '{"hook_event_name":"SessionStart","source":"startup"}' |
            & "$env:PLUGIN_ROOT\hooks\run-context-window.cmd"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $message = (
            $output | ConvertFrom-Json
          ).hookSpecificOutput.additionalContext
          if ($message -ne '<meta>YOUR SESSION JUST STARTED</meta>') {
            throw "Unexpected hook output: $output"
          }

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Validate JSON
        run: >-
          python3 -c "import json;
          json.load(open('.codex-plugin/plugin.json'));
          json.load(open('hooks/hooks.json'))"
